services:
  # ── APLICAÇÃO STARTER (EXPRESS + TYPESCRIPT) ─────────────────────────────────
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: nosql_app
    ports:
      - "3400:3400"
    environment:
      - PORT=3400
      - NODE_ENV=${NODE_ENV:-development}
      - PERMITIR_SIMULACAO_FALHA=${PERMITIR_SIMULACAO_FALHA:-false}
      - MONGO_URI=mongodb://root:root@mongo:27017
      - MONGO_DB_NAME=borala
      - REDIS_URL=redis://redis:6379
      - ELASTICSEARCH_NODE=http://elasticsearch:9200
    volumes:
      - ./app/src:/app/src
      - ./init:/app/init:ro
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3400/api/health').then(async r => { if (r.status !== 200) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 60s
    restart: unless-stopped

  # ── MONGODB & MONGO EXPRESS ──────────────────────────────────────────────────
  mongo:
    image: mongo:7
    container_name: nosql_mongo
    command: ["mongod", "--config", "/etc/mongod.conf"]
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--username",
          "root",
          "--password",
          "root",
          "--authenticationDatabase",
          "admin",
          "--quiet",
          "--eval",
          "db.adminCommand('ping')"
        ]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
    ports:
      - "27034:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_logs:/var/log/mongodb
      - ./mongod.conf:/etc/mongod.conf:ro
      - ./init/mongo-init.js:/docker-entrypoint-initdb.d/init.js:ro
    restart: unless-stopped

  mongo-express:
    image: mongo-express:latest
    container_name: nosql_mongo_express
    ports:
      - "8401:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: root
      ME_CONFIG_MONGODB_ADMINPASSWORD: root
      ME_CONFIG_MONGODB_URL: mongodb://root:root@mongo:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      - mongo
    restart: unless-stopped

  # ── REDIS & REDIS COMMANDER ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nosql_redis
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "6334:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: nosql_redis_commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8402:8081"
    depends_on:
      - redis
    restart: unless-stopped

  # ── ELASTICSEARCH & ELASTICVUE ────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=3s' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    container_name: nosql_elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9234:9200"
    volumes:
      - elastic_data:/usr/share/elasticsearch/data
      - ./elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    restart: unless-stopped

  elasticvue:
    image: cars10/elasticvue:latest
    container_name: nosql_elasticvue
    ports:
      - "8400:8080"
    depends_on:
      - elasticsearch
    restart: unless-stopped

volumes:
  mongo_data:
  mongo_logs:
  redis_data:
  elastic_data:
