# mongod.conf — configuração do MongoDB para ambiente de estudo
# Disciplina: Banco de Dados NoSQL — TSI34E / UTFPR Guarapuava
#
# Referência rápida de seções:
#   storage     → onde os dados ficam no disco
#   systemLog   → onde os logs são escritos
#   net         → porta e quem pode conectar
#   security    → autenticação (usuário/senha)
#   operationProfiling → slow query log (benchmark de queries)
#   replication → Replica Set (comentado — só ativar se tiver 3 instâncias)

# ── Armazenamento ─────────────────────────────────────────────────────────────
storage:
  dbPath: /data/db

# ── Logs ──────────────────────────────────────────────────────────────────────
systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  verbosity: 0
  component:
    query:
      verbosity: 1

# ── Rede ──────────────────────────────────────────────────────────────────────
net:
  port: 27017
  bindIp: 0.0.0.0

# ── Segurança ─────────────────────────────────────────────────────────────────
security:
  authorization: enabled

# ── Slow Query Log (Profiler) ─────────────────────────────────────────────────
operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 100

# Para consultar as operações registradas no mongosh:
#   use borala
#   db.system.profile.find().sort({ ts: -1 }).limit(5).pretty()

